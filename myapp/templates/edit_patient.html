{% extends 'base.html' %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-box">

        <h1>Edit Patient</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Patient Name</label>
                <input type="text" name="name" id="name" value="{{ patient.name }}" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" name="age" id="age" value="{{ patient.age }}" required>
            </div>

            <div class="form-group">
                <label for="disease">Disease</label>
                <input type="text" name="disease" id="disease" value="{{ patient.disease }}" placeholder="Enter disease">


            <div style="margin-top: 15px; margin-bottom: 20px;">

                <label  for="doctor">Select Doctor:</label>

                <select name="doctor" id="doctor"
                    style="display: block; margin-top: 8px; padding: 10px; width: 100%;">

                    <option value="">No Doctor</option>

                    {% for doctor in doctors %}

                        <option value="{{ doctor.id }}">
                            {% if patient.doctor_id == doctor.id %}selected{% endif %}
                            {{ doctor.name }}
                        </option>

                    {% endfor %}
                </select>
            </div>

            <button type="submit">Update Patient</button>
        </form>

        <a href="{% url 'patients' %}" class="back-link">← Back to Patients</a>

    </div>
</div>
{% endblock %}
