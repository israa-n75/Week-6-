{% extends 'base.html' %}

{% block title %}Add Department{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-box">

        <h1>Add Department</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Department Name</label>
                <input type="text" name="name" id="name" placeholder="e.g. Cardiology" required>
            </div>

            <div class="form-group">
                <label for="doctor_name">Doctor Name</label>
                <input type="text" name="doctor_name" id="doctor_name" placeholder="Enter doctor name" required>
            </div>

            <button type="submit">Add Department</button>
        </form>

        <a href="{% url 'departments' %}" class="back-link">← Back to Departments</a>

    </div>
</div>
{% endblock %}
