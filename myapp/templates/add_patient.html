<!DOCTYPE html>
<html>
<head>
    <title>Add Patient - Hospital Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #11998e;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #d5f0ea;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #11998e;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #11998e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0c7a70;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #11998e;
        }
    </style>
</head>

<body>
    <div class="form-box">

        <h1>Add Patient</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Enter patient name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    name="age"
                    id="age"
                    placeholder="Enter patient age"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="disease">Disease</label>
                <input
                    type="text"
                    name="disease"
                    id="disease"
                    placeholder="Enter patient disease"
                    required
                >
            </div>

            <button type="submit">Add Patient</button>
        </form>

        <a href="{% url 'patients' %}" class="back-link">
            Back to Patients
        </a>

    </div>
</body>
</html>
