{% extends 'base.html' %}

{% block title %}Edit Doctor{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-box">

        <h1>Edit Doctor</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Doctor Name</label>
                <input type="text" name="name" id="name" value="{{ doctor.name }}" required>
            </div>

            <div class="form-group">
                <label for="specialization">Specialization</label>
                <input type="text" name="specialization" id="specialization" value="{{ doctor.specialization }}" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" name="age" id="age" value="{{ doctor.age }}" required>
            </div>

            <!-- Department Dropdown -->
            <div class="form-group">
                <label for="department">Department</label>

                <select name="department" id="department">
                    <option value="">-- Choose Department --</option>

                    {% for department in departments %}
                        <option
                            value="{{ department.id }}"
                            {% if doctor.department_id == department.id %}selected{% endif %}
                        >
                            {{ department.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Update Doctor</button>
        </form>

        <a href="{% url 'doctors' %}" class="back-link">← Back to Doctors</a>

    </div>
</div>
{% endblock %}
