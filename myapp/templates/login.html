{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
    /* base-il 420px aanu, ivide 400px venam */
    .form-box {
        max-width: 400px;
    }

    /* base-il margin-bottom 30px aanu, ivide 8px (subtitle thaazhe varunnathu kondu) */
    .form-box h1 {
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: var(--text-light);
        margin-bottom: 30px;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-box">

        <h1>🔐 Login</h1>
        <p class="subtitle">Hospital Management System</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password">
            </div>

            <button type="submit">Login</button>
        </form>

    </div>
</div>
{% endblock %}
