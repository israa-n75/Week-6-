<!DOCTYPE html>
<html>
<head>
    <title>Hospital Patients</title>

    <style>
    :root {
        --primary: #0B2545;        /* dark navy blue */
        --secondary: #0E9AA7;      /* medical teal */
        --background: #F3F5F7;     /* very light grey */
        --card: #FFFFFF;           /* white */
        --text: #333840;           /* dark grey */
        --text-light: #6B7280;
        --border: #DCE3E8;
        --tint: #E3F4F6;           /* light teal tint */
        --danger: #C0392B;
        --danger-tint: #FDE9E7;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        padding: 30px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    /* Home Button */
    .home-link {
        display: inline-block;
        background: var(--card);
        color: var(--primary);
        border: 2px solid var(--border);
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        transition: all 0.2s;
    }

    .home-link:hover {
        background: var(--tint);
        border-color: var(--secondary);
        color: var(--primary);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .header h1 {
        color: var(--primary);
    }

    .add-patient {
        display: inline-block;
        background: var(--primary);
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        margin-bottom: 25px;
        transition: background 0.2s;
    }

    .add-patient:hover {
        background: #16386B;
    }

    .patient-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 22px;
    }

    .patient-card {
        background: var(--card);
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(11, 37, 69, 0.08);
        border-top: 5px solid var(--primary);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .patient-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 22px rgba(11, 37, 69, 0.15);
    }

    .patient-number {
        color: var(--text-light);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 12px;

    }

    .patient-name {
        font-size: 21px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 16px;
        overflow-wrap: anywhere;
    }

    .patient-detail {
        color: var(--text);
        margin-bottom: 10px;
        font-size: 15px;
        overflow-wrap: anywhere;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
    }

    .btn {
        flex: 1;
        text-align: center;
        padding: 10px;
        border-radius: 7px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-edit {
        background: var(--tint);
        color: var(--primary);
    }

    .btn-edit:hover {
        background: var(--card);
        border-color: var(--secondary);
        color: var(--primary);
    }

    .btn-delete {
        background: var(--danger-tint);
        color: var(--danger);
    }

    .btn-delete:hover {
        background: var(--danger);
        color: white;
    }

    .empty-message {
        background: var(--card);
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        color: var(--text-light);
        grid-column: 1 / -1;
    }

    @media (max-width: 500px) {
        body {
            padding: 18px;
        }

        .header h1 {
            font-size: 22px;
        }
    }
</style>


</head>

<body>

    <div class="container">

        <!-- Home Button -->
        <a href="{% url 'home' %}" class="home-link">
            &larr; Home
        </a>

        <div class="header">
            <h1>Hospital Patients</h1>
        </div>

        <!-- Add Patient -->
        <a href="{% url 'add_patient' %}" class="add-patient">
            + Add Patient
        </a>

        <!-- Patient Cards -->
        <div class="patient-grid">

            {% for patient in patients %}

                <div class="patient-card">

                    <p class="patient-number">
                        Patient #{{ patient.id }}
                    </p>

                    <h2 class="patient-name">
                        {{ patient.name }}
                    </h2>

                    <p class="patient-detail">
                        <strong>Age:</strong> {{ patient.age }}
                    </p>

                    <p class="patient-detail">
                        <strong>Disease:</strong>
                        {{ patient.disease|default:"Not specified" }}
                    </p>

                    <div class="actions">

                        <!-- Edit -->
                        <a href="{% url 'edit_patient' patient.id %}"
                           class="btn btn-edit">
                            Edit
                        </a>

                        <!-- Delete -->
                        <form method="POST"
                              action="{% url 'delete_patient' patient.id %}"
                              style="flex: 1; margin: 0;">

                            {% csrf_token %}

                            <button type="submit"
                                    class="btn btn-delete"
                                    style="width: 100%;"
                                    onclick="return confirm('Are you sure you want to delete this patient?');">
                                Delete
                            </button>

                        </form>

                    </div>

                </div>

            {% empty %}

                <div class="empty-message">
                    No patients added yet.
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
