{% extends 'base.html' %}

{% block title %}Edit Department{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-box">

        <h1>Edit Department</h1>

        <form method="POST">
            {% csrf_token %}

            <!-- Department Name -->
            <div class="form-group">
                <label for="name">Department Name</label>
                <input type="text" name="name" id="name" value="{{ department.name }}" placeholder="Enter department name" required>
            </div>

            <!-- Doctor Name -->
            <div class="form-group">
                <label for="doctor_name">Doctor Name</label>
                <input type="text" name="doctor_name" id="doctor_name" value="{{ department.doctor_name }}" placeholder="Enter doctor name" required>
            </div>

            <button type="submit">Update Department</button>
        </form>

        <a href="{% url 'departments' %}" class="back-link">← Back to Departments</a>

    </div>
</div>
{% endblock %}
