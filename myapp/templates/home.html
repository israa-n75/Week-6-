<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System</title>
    <style>
    :root {
        --primary: #0B2545;        /* dark navy blue */
        --secondary: #0E9AA7;      /* medical teal */
        --secondary-dark: #0A7D88;
        --background: #F3F5F7;     /* very light grey */
        --card: #FFFFFF;           /* white */
        --text: #333840;           /* dark grey */
        --text-light: #6B7280;
        --border: #DCE3E8;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background: var(--card);
        max-width: 620px;
        width: 100%;
        padding: 40px;
        border-radius: 20px;
        border-top: 6px solid var(--primary);
        box-shadow: 0 10px 30px rgba(11, 37, 69, 0.12);
        text-align: center;
    }

    .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 18px;
        background: #E3F4F6;
        border: 2px solid var(--secondary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
    }

    h1 {
        color: var(--primary);
        font-size: 28px;
    }

    .subtitle {
        color: var(--text-light);
        margin: 8px 0 30px;
    }

    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .menu a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 22px 10px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 14px;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
    }

    .menu a .icon {
        font-size: 28px;
    }

    .menu a:hover {
        background: #E3F4F6;
        color: var(--primary);
        border-color: var(--secondary);
        transform: translateY(-4px);
        box-shadow: 0 8px 18px rgba(11, 37, 69, 0.15);

    }

    .menu a.wide {
        grid-column: span 2;
    }

    .menu a.login {
        grid-column: span 2;
        flex-direction: row;
        justify-content: center;
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    .menu a.login:hover {
        background: var(--secondary-dark);
        border-color: var(--secondary-dark);
    }

    @media (max-width: 450px) {
        .container {
            padding: 25px 18px;
        }

        h1 {
            font-size: 23px;
        }
    }
</style>

    
</head>

<body>
    <div class="container">

        <div class="logo">🏥</div>

        <h1>Hospital Management System</h1>
        <p class="subtitle">Welcome to our Hospital</p>

        <div class="menu">

            <a href="{% url 'patients' %}">
                <span class="icon">👤</span>
                View Patients
            </a>

            <a href="{% url 'doctors' %}">
                <span class="icon">🩺</span>
                View Doctors
            </a>

            <a href="{% url 'departments' %}" class="wide">
                <span class="icon">🏢</span>
                Departments
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'logout' %}" class="login">
                    <span class="icon">🔓</span>
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="login">
                    <span class="icon">🔐</span>
                    Login
                </a>

            {% endif %}

        </div>
    </div>
</body>
</html>
