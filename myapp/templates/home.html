{% extends 'base.html' %}

{% block title %}Hospital Management System{% endblock %}

{% block extra_css %}
<style>
    :root {
        --secondary-dark: #0A7D88;
    }

    .container {
        background: var(--card);
        max-width: 620px;
        width: 100%;
        padding: 40px;
        border-radius: 20px;
        border-top: 6px solid var(--primary);
        box-shadow: 0 10px 30px rgba(11, 37, 69, 0.12);
        text-align: center;
    }

    .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 18px;
        background: #E3F4F6;
        border: 2px solid var(--secondary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
    }

    .container h1 {
        color: var(--primary);
        font-size: 28px;
    }

    .subtitle {
        color: var(--text-light);
        margin: 8px 0 30px;
    }

    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .menu a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 22px 10px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 14px;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
    }

    .menu a .icon {
        font-size: 28px;
    }

    .menu a:hover {
        background: #E3F4F6;
        color: var(--primary);
        border-color: var(--secondary);
        transform: translateY(-4px);
        box-shadow: 0 8px 18px rgba(11, 37, 69, 0.15);
    }

    .menu a.login {
        grid-column: span 2;
        flex-direction: row;
        justify-content: center;
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    .menu a.login:hover {
        background: var(--secondary-dark);
        border-color: var(--secondary-dark);
    }

    @media (max-width: 450px) {
        .container {
            padding: 25px 18px;
        }

        .container h1 {
            font-size: 23px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="container">

        <div class="logo">🏥</div>

        <h1>Hospital Management System</h1>
        <p class="subtitle">Welcome to our Hospital</p>

        <div class="menu">

            <a href="{% url 'patients' %}">
                <span class="icon">👤</span>
                View Patients
            </a>

            <a href="{% url 'doctors' %}">
                <span class="icon">🩺</span>
                View Doctors
            </a>

            <a href="{% url 'departments' %}">
                <span class="icon">🏢</span>
                Departments
            </a>

            <a href="{% url 'treatments' %}">
                <span class="icon">💊</span>
                Treatments
            </a>
        </div>
    </div>
</div>
{% endblock %}
