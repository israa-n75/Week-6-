<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Management System{% endblock %}</title>

    <style>
        :root {
            --primary: #0B2545;
            --secondary: #0E9AA7;
            --background: #F3F5F7;
            --card: #FFFFFF;
            --text: #333840;
            --text-light: #6B7280;
            --border: #DCE3E8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        /* ---------- Navbar ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            padding: 14px 32px;
        }

        .brand {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #2EC4B6;
        }

        .nav-links a.login-btn {
            background: #2EC4B6;
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 8px;
        }

        /* ---------- Common form styles ---------- */
        .page-wrap {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-box {
            background: var(--card);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 16px;
            border-top: 6px solid var(--primary);
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.12);
        }

        .form-box h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-box input,
        .form-box select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-box input::placeholder {
            color: #9AA3AD;
        }

        .form-box input:focus,
        .form-box select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(14, 154, 167, 0.15);
        }

        .form-box button {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .form-box button:hover {
            background: #16386B;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include 'navbar.html' %}

    {% block content %}
    {% endblock %}

</body>
</html>
